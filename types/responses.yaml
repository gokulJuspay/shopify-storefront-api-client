# GraphQL Response types for Shopify Storefront API
# These match the actual GraphQL response structure

Responses:
  # Product responses
  ProductResponse:
    type: object
    description: 'GraphQL response containing a single product'
    properties:
      product:
        $ref: './types/products.yaml#/Products/Product'

  ProductsResponse:
    type: object
    description: 'GraphQL response containing product connection'
    properties:
      products:
        $ref: './types/products.yaml#/Products/ProductConnection'

  ProductRecommendationsResponse:
    type: object
    description: 'GraphQL response containing product recommendations'
    properties:
      productRecommendations:
        type: array
        items:
          $ref: './types/products.yaml#/Products/Product'

  ProductsByIdsResponse:
    type: object
    description: 'GraphQL response containing products resolved by ID via the nodes query'
    properties:
      nodes:
        type: array
        items:
          $ref: './types/products.yaml#/Products/Product'

  ProductVariantsResponse:
    type: object
    description: 'GraphQL response containing product variants resolved by ID'
    properties:
      nodes:
        type: array
        items:
          $ref: './types/products.yaml#/Products/ProductVariant'

  # Collection responses
  CollectionResponse:
    type: object
    description: 'GraphQL response containing a single collection'
    properties:
      collection:
        $ref: './types/collections.yaml#/Collections/Collection'

  CollectionsResponse:
    type: object
    description: 'GraphQL response containing collection connection'
    properties:
      collections:
        $ref: './types/collections.yaml#/Collections/CollectionConnection'

  CollectionsByIdsResponse:
    type: object
    description: 'GraphQL response containing collections resolved by ID via the nodes query'
    properties:
      nodes:
        type: array
        items:
          $ref: './types/collections.yaml#/Collections/Collection'

  ProductCollections:
    type: object
    description: 'A product with the collections it belongs to'
    required:
      - id
      - collections
    properties:
      id:
        type: string
      collections:
        $ref: './types/collections.yaml#/Collections/CollectionConnection'

  ProductCollectionsResponse:
    type: object
    description: 'GraphQL response containing the collections of a product'
    properties:
      product:
        $ref: './types/responses.yaml#/Responses/ProductCollections'

  # Cart responses
  CartResponse:
    type: object
    description: 'GraphQL response containing a cart'
    properties:
      cart:
        $ref: './types/cart.yaml#/Cart/Cart'

  CartCreateResponse:
    type: object
    description: 'GraphQL response for cartCreate mutation'
    properties:
      cartCreate:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartLinesAddResponse:
    type: object
    description: 'GraphQL response for cartLinesAdd mutation'
    properties:
      cartLinesAdd:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartLinesUpdateResponse:
    type: object
    description: 'GraphQL response for cartLinesUpdate mutation'
    properties:
      cartLinesUpdate:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartLinesRemoveResponse:
    type: object
    description: 'GraphQL response for cartLinesRemove mutation'
    properties:
      cartLinesRemove:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartNoteUpdateResponse:
    type: object
    description: 'GraphQL response for cartNoteUpdate mutation'
    properties:
      cartNoteUpdate:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartAttributesUpdateResponse:
    type: object
    description: 'GraphQL response for cartAttributesUpdate mutation'
    properties:
      cartAttributesUpdate:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartBuyerIdentityUpdateResponse:
    type: object
    description: 'GraphQL response for cartBuyerIdentityUpdate mutation'
    properties:
      cartBuyerIdentityUpdate:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartDiscountCodesUpdateResponse:
    type: object
    description: 'GraphQL response for cartDiscountCodesUpdate mutation'
    properties:
      cartDiscountCodesUpdate:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  CartGiftCardCodesAddResponse:
    type: object
    description: 'GraphQL response for cartGiftCardCodesAdd mutation'
    properties:
      cartGiftCardCodesAdd:
        $ref: './types/cart.yaml#/Cart/CartMutationResult'

  # Customer responses
  CustomerResponse:
    type: object
    description: 'GraphQL response containing a customer'
    properties:
      customer:
        $ref: './types/customer.yaml#/Customer/Customer'

  CustomerAccessTokenCreateResponse:
    type: object
    description: 'GraphQL response for customerAccessTokenCreate mutation'
    properties:
      customerAccessTokenCreate:
        $ref: './types/customer.yaml#/Customer/AccessTokenResult'

  CustomerAccessTokenRenewResponse:
    type: object
    description: 'GraphQL response for customerAccessTokenRenew mutation'
    properties:
      customerAccessTokenRenew:
        $ref: './types/customer.yaml#/Customer/AccessTokenResult'

  CustomerAccessTokenDeleteResponse:
    type: object
    description: 'GraphQL response for customerAccessTokenDelete mutation'
    properties:
      customerAccessTokenDelete:
        $ref: './types/responses.yaml#/Responses/CustomerAccessTokenDeleteResult'

  CustomerAccessTokenDeleteResult:
    type: object
    description: 'Result of customerAccessTokenDelete mutation'
    properties:
      deletedAccessToken:
        type: string
      deletedCustomerAccessTokenId:
        type: string
      customerUserErrors:
        type: array
        items:
          $ref: './types/customer.yaml#/Customer/CustomerUserError'

  CustomerCreateResponse:
    type: object
    description: 'GraphQL response for customerCreate mutation'
    properties:
      customerCreate:
        $ref: './types/customer.yaml#/Customer/CustomerMutationResult'

  CustomerUpdateResponse:
    type: object
    description: 'GraphQL response for customerUpdate mutation'
    properties:
      customerUpdate:
        $ref: './types/customer.yaml#/Customer/CustomerMutationResult'

  CustomerRecoverResponse:
    type: object
    description: 'GraphQL response for customerRecover mutation'
    properties:
      customerRecover:
        $ref: './types/responses.yaml#/Responses/CustomerRecoverResult'

  CustomerRecoverResult:
    type: object
    description: 'Result of customerRecover mutation'
    properties:
      customerUserErrors:
        type: array
        items:
          $ref: './types/customer.yaml#/Customer/CustomerUserError'

  CustomerResetResponse:
    type: object
    description: 'GraphQL response for customerReset mutation'
    properties:
      customerReset:
        $ref: './types/customer.yaml#/Customer/AccessTokenResult'

  CustomerResetByUrlResponse:
    type: object
    description: 'GraphQL response for customerResetByUrl mutation'
    properties:
      customerResetByUrl:
        $ref: './types/customer.yaml#/Customer/AccessTokenResult'

  CustomerActivateResponse:
    type: object
    description: 'GraphQL response for customerActivate mutation'
    properties:
      customerActivate:
        $ref: './types/customer.yaml#/Customer/AccessTokenResult'

  CustomerActivateByUrlResponse:
    type: object
    description: 'GraphQL response for customerActivateByUrl mutation'
    properties:
      customerActivateByUrl:
        $ref: './types/customer.yaml#/Customer/AccessTokenResult'

  CustomerAddressCreateResponse:
    type: object
    description: 'GraphQL response for customerAddressCreate mutation'
    properties:
      customerAddressCreate:
        $ref: './types/customer.yaml#/Customer/AddressMutationResult'

  CustomerAddressUpdateResponse:
    type: object
    description: 'GraphQL response for customerAddressUpdate mutation'
    properties:
      customerAddressUpdate:
        $ref: './types/customer.yaml#/Customer/AddressMutationResult'

  CustomerAddressDeleteResponse:
    type: object
    description: 'GraphQL response for customerAddressDelete mutation'
    properties:
      customerAddressDelete:
        $ref: './types/responses.yaml#/Responses/CustomerAddressDeleteResult'

  CustomerAddressDeleteResult:
    type: object
    description: 'Result of customerAddressDelete mutation'
    properties:
      deletedCustomerAddressId:
        type: string
      customerUserErrors:
        type: array
        items:
          $ref: './types/customer.yaml#/Customer/CustomerUserError'

  CustomerDefaultAddressUpdateResponse:
    type: object
    description: 'GraphQL response for customerDefaultAddressUpdate mutation'
    properties:
      customerDefaultAddressUpdate:
        $ref: './types/customer.yaml#/Customer/CustomerMutationResult'

  # Search responses
  SearchResponse:
    type: object
    description: 'GraphQL response for search query'
    properties:
      search:
        $ref: './types/search.yaml#/Search/SearchResultItemConnection'

  PredictiveSearchResponse:
    type: object
    description: 'GraphQL response for predictiveSearch query'
    properties:
      predictiveSearch:
        $ref: './types/search.yaml#/Search/PredictiveSearchResult'

  # Content responses
  PageResponse:
    type: object
    description: 'GraphQL response containing a page'
    properties:
      page:
        $ref: './types/content.yaml#/Content/Page'

  PagesResponse:
    type: object
    description: 'GraphQL response containing page connection'
    properties:
      pages:
        $ref: './types/content.yaml#/Content/PageConnection'

  BlogResponse:
    type: object
    description: 'GraphQL response containing a blog'
    properties:
      blog:
        $ref: './types/content.yaml#/Content/Blog'

  BlogsResponse:
    type: object
    description: 'GraphQL response containing blog connection'
    properties:
      blogs:
        $ref: './types/content.yaml#/Content/BlogConnection'

  ArticleResponse:
    type: object
    description: 'GraphQL response containing an article'
    properties:
      article:
        $ref: './types/content.yaml#/Content/Article'

  ArticlesResponse:
    type: object
    description: 'GraphQL response containing article connection'
    properties:
      articles:
        $ref: './types/content.yaml#/Content/ArticleConnection'

  MenuResponse:
    type: object
    description: 'GraphQL response containing a menu'
    properties:
      menu:
        $ref: './types/content.yaml#/Content/Menu'

  # Metaobject responses
  MetaobjectResponse:
    type: object
    description: 'GraphQL response containing a metaobject'
    properties:
      metaobject:
        $ref: './types/metafields.yaml#/Metafields/Metaobject'

  MetaobjectsResponse:
    type: object
    description: 'GraphQL response containing metaobject connection'
    properties:
      metaobjects:
        $ref: './types/metafields.yaml#/Metafields/MetaobjectConnection'

  # Shop responses
  ShopResponse:
    type: object
    description: 'GraphQL response containing shop info'
    properties:
      shop:
        $ref: './types/shop.yaml#/Shop/Shop'

  LocalizationResponse:
    type: object
    description: 'GraphQL response containing localization info'
    properties:
      localization:
        $ref: './types/localization.yaml#/Localization/Localization'
